<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14.5' fill='%23fff' stroke='%23222' stroke-width='2'/%3E%3Cpath d='M1.5 16a14.5 14.5 0 0 1 29 0z' fill='%23e3350d' stroke='%23222' stroke-width='2'/%3E%3Cline x1='1.5' y1='16' x2='30.5' y2='16' stroke='%23222' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff' stroke='%23222' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
/* The app's own tokens (App.axaml, dark): the page looks like the Pokédex tab */
:root{--base:#22262e;--base2:#2a2f38;--panel:#2b3039;--panel2:#333944;--field:#1e2228;--line:#3c4350;--input:#5a6372;--text:#eceef2;--muted:#a9b1bd;--hover:#3a414d;--accent:#f39c3c;--accentText:#f5b05a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--text);font:13px/1.35 "Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,var(--base),var(--base2))}
main{display:grid;grid-template-columns:440px 1fr;gap:12px;height:100%;padding:10px}
aside{display:flex;flex-direction:column;gap:8px;min-height:0}
input[type=search]{background:var(--field);border:1px solid var(--input);color:var(--text);border-radius:2px;padding:6px 8px;font:inherit;width:100%}
input[type=search]:focus{outline:none;border-color:var(--accent)}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:2px;padding:4px 10px;cursor:pointer;font:inherit}
.btn:hover{background:var(--hover)}.btn.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
label.tg{display:flex;gap:6px;align-items:center;cursor:pointer}
.hint{color:var(--muted)}
#list{flex:1;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:2px}
.row{display:grid;grid-template-columns:5px 46px 46px 1fr auto;align-items:center;gap:6px;padding:2px 12px 2px 0;cursor:pointer;min-height:36px}
.row:hover{background:var(--hover)}.row.sel{background:var(--accent);color:#1a1a1a}.row.sel .num{color:#1a1a1a}
.row .strip{height:100%}.row img{width:40px;height:30px;image-rendering:pixelated;justify-self:center}
.row .num{color:var(--muted)}
.flags{display:flex;gap:4px}
.flag{font-size:11px;padding:1px 7px;border-radius:2px;border:1px solid var(--input);color:var(--muted);background:transparent}
.flag.seen.on{background:#2f7bbf;border-color:#1f5e96;color:#fff}.flag.caught.on{background:#c0392b;border-color:#8e2a20;color:#fff}
.flag.large{font-size:12px;padding:2px 10px}
#detail{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:10px 12px}
.card-title{color:var(--accentText);font-weight:600;margin:0 0 6px}
.header{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:2px;border:1px solid #0003}
.header .pic{width:112px;height:84px;background:#ffffff50;border-radius:2px;display:flex;align-items:center;justify-content:center}
.header .pic img{width:96px;height:72px;image-rendering:pixelated}
.header .name{font-size:22px;font-weight:700}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:0 6px;border-radius:2px;font-size:11px;font-weight:600;border:1px solid #0003;line-height:18px}
.badges{display:flex;gap:6px;justify-content:flex-end}
.badge{background:#fff;color:#1a1a1a;border-radius:2px;padding:3px 9px;text-align:center;min-width:56px}
.badge small{display:block;font-size:10px;color:#666}.badge b{font-size:15px}
.entry{display:grid;grid-template-columns:5px 1fr;padding:0}.entry>div:last-child{padding:10px 14px 12px}
.entry p{margin:0;font-size:14px;line-height:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-row{display:grid;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.info-row:last-child{border-bottom:0}
.stat{grid-template-columns:80px 36px 1fr}
.track{height:10px;background:var(--panel2)}.track i{display:block;height:100%;border:1px solid #0000004d}
.mu{grid-template-columns:44px 1fr}.mu .lab{width:36px;height:20px;border-radius:2px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.data{grid-template-columns:130px 1fr}.data b{font-weight:600}
.evo{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 0}
.stage{display:flex;flex-direction:column;gap:6px}
.mon{width:148px;min-height:116px;padding:8px 8px 8px;border-radius:4px;border:1px solid #0000004d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.mon.cur{outline:3px solid #fff;outline-offset:-1px;cursor:default}
.mon img{width:80px;height:60px;image-rendering:pixelated}
.mon b{font-size:13px}
.how{background:#ffffffd9;color:#1a1a1a;border-radius:2px;padding:1px 6px;font-size:11px;text-align:center}
.arrow{color:var(--muted);font-size:20px;padding:0 4px}
svg text{font:600 11px "Segoe UI",system-ui,sans-serif}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#list{max-height:45vh}.two{grid-template-columns:1fr}}
select,input[type=number]{background:var(--field);border:1px solid var(--input);color:var(--text);border-radius:2px;padding:4px 6px;font:inherit;min-width:0}
select:focus,input[type=number]:focus{outline:none;border-color:var(--accent)}
details.filters{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:6px 10px}
details.filters summary{cursor:pointer;color:var(--accentText);font-weight:600}
.fgrid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;margin-top:8px}
.fgrid .dash{color:var(--muted);text-align:center}
.tri{display:flex;gap:4px;align-items:center;background:transparent;border:0;color:var(--text);cursor:pointer;font:inherit;padding:2px 0}
.tri .box{width:16px;height:16px;border:1px solid var(--input);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.tri .box.on{background:#2f7bbf;border-color:#2f7bbf}.tri .box.off{background:#c0392b;border-color:#c0392b}
.row .bst{color:var(--muted);font-variant-numeric:tabular-nums}.row.sel .bst{color:#1a1a1a}
.total{background:#fff;color:#1a1a1a;border-radius:2px;padding:3px 10px;text-align:center}
.total small{display:block;font-size:10px;color:#666}.total b{font-size:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="loader" hidden>
  <div class="card" style="max-width:520px;margin:12vh auto;padding:28px;text-align:center">
    <div class="card-title" id="ldTitle" style="font-size:20px"></div>
    <p class="hint" id="ldHint"></p>
    <label class="btn" style="display:inline-block;margin-top:10px;cursor:pointer"><span id="ldPick"></span>
      <input type="file" id="ldFile" accept=".pkdex,.json,application/json" hidden></label>
    <p class="hint" id="ldError" style="color:#E5383B"></p>
  </div>
</div>
<main id="app">
  <aside>
    <input type="search" id="q">
    <details class="filters" id="filters"><summary id="fSum"></summary>
      <div class="fgrid">
        <span id="fTypeL"></span><select id="t1"></select><span class="dash">+</span><select id="t2"></select>
        <span id="fBstL"></span><input type="number" id="bmin" min="0" max="1200" step="10"><span class="dash">–</span><input type="number" id="bmax" min="0" max="1200" step="10">
      </div>
      <div class="bar" style="margin-top:8px">
        <button class="tri" id="fMega"><span class="box"></span><span id="fMegaL"></span></button>
        <button class="tri" id="fLeg"><span class="box"></span><span id="fLegL"></span></button>
        <label class="tg"><input type="checkbox" id="forms"> <span id="formsL"></span></label>
        <button class="btn" id="fClear" style="margin-left:auto"></button>
      </div>
    </details>
    <div class="hint" id="count"></div>
    <div id="list"></div>
    <div class="hint" id="made"></div>
  </aside>
  <section id="detail"></section>
</main>
<script>
const D0=/*DATA*/null;
// The same page serves the app's file, the phone, and the viewer published with the project (docs/pokedex): with no
// data inside, it asks for a Pokédex file (.pkdex, exported from the app) or takes one from ?src=<address>.
function start(D){
$('loader').hidden=true;$('app').hidden=false;
const T=D.text,TY=D.types,E=D.entries;
document.documentElement.style.setProperty('--accent',D.accent||'#f39c3c');
document.documentElement.style.setProperty('--accentText',D.accentText||'#f5b05a');
const byKey=new Map(E.map(e=>[e.k,e]));
const kids=new Map(),parent=new Map();
for(const [a,b,h] of D.edges){if(!byKey.has(a)||!byKey.has(b)||a==b)continue;if(!kids.has(a))kids.set(a,[]);if(!kids.get(a).some(x=>x[0]==b))kids.get(a).push([b,h]);if(!parent.has(b))parent.set(b,a);}
// Only what the user wants to look at (2026-11-24): base stats, types, the levels moves are learned at and how each
// Pokémon evolves. No abilities, no seen/caught. Filters as the app's Pokédex: type pair, BST range, megas, legendaries,
// forms.
const es=(document.documentElement.lang||navigator.language||'').toLowerCase().startsWith('es');
const F=Object.assign(es?{filters:'Filtros',filtersOn:'Filtros ({0} activos)',type:'Tipo',bst:'BST',megas:'Megas',legendaries:'Legendarios',hideForms:'Sin formas',clear:'Quitar filtros',anyType:'—',shown:'{0} Pokémon',
  typeTip:'Un tipo: los que lo tienen. Dos: solo esa pareja, en cualquier orden.',triTip:'Clic para cambiar: en blanco todos, ✓ solo estos, ✕ ninguno.',formsTip:'Una fila por especie: oculta megas, formas regionales y demás.'}
  :{filters:'Filters',filtersOn:'Filters ({0} on)',type:'Type',bst:'BST',megas:'Megas',legendaries:'Legendaries',hideForms:'No forms',clear:'Clear filters',anyType:'—',shown:'{0} Pokémon',
  typeTip:'One type: those that have it. Two: only that pair, in any order.',triTip:'Click to change: blank all, ✓ only these, ✕ none.',formsTip:'One row per species: hides megas, regional forms and the rest.'},T.filterText||{});
let cur=null,t1=-1,t2=-1,bmin=null,bmax=null,mega=0,leg=0,hideForms=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const softC=h=>rgb(h).map(c=>Math.round(c+(255-c)*.18));
const soft=h=>`rgb(${softC(h).join(',')})`;
function fg(types){const l=types.reduce((s,t)=>{const [r,g,b]=softC(TY[t].c);return s+(0.299*r+0.587*g+0.114*b)/255},0)/types.length;return l<.62?'#fff':'#1a1a1a'}
function bg(types){const a=soft(TY[types[0]].c),b=soft(TY[types[types.length-1]].c);return a==b?a:`linear-gradient(135deg,${a} 50%,${b} 50%)`}
const chip=t=>`<span class="chip" style="background:${soft(TY[t].c)};color:${fg([t])}">${esc(TY[t].n)}</span>`;
const statColor=v=>v<30?'#F34444':v<60?'#FF7F0F':v<90?'#FFDD57':v<120?'#A0E515':v<150?'#23CD5E':'#00C2B8';
const num=s=>'#'+String(s).padStart(3,'0');
const bst=e=>e.st.reduce((a,b)=>a+b,0);
$('q').placeholder=T.search;$('formsL').textContent=F.hideForms;$('made').textContent=T.made||'';
$('fTypeL').textContent=F.type;$('fBstL').textContent=F.bst;$('fMegaL').textContent=F.megas;$('fLegL').textContent=F.legendaries;$('fClear').textContent=F.clear;
$('t1').title=$('t2').title=F.typeTip;$('fMega').title=$('fLeg').title=F.triTip;$('forms').parentElement.title=F.formsTip;
const typeOrder=TY.map((t,i)=>i).sort((a,b)=>TY[a].n.localeCompare(TY[b].n));
for(const id of ['t1','t2']){const sel=$(id);sel.innerHTML=`<option value="-1">${esc(F.anyType)}</option>`+typeOrder.map(i=>`<option value="${i}">${esc(TY[i].n)}</option>`).join('');}
const numOrNull=v=>v===''?null:Number(v);
$('t1').onchange=e=>{t1=+e.target.value;renderList()};$('t2').onchange=e=>{t2=+e.target.value;renderList()};
$('bmin').oninput=e=>{bmin=numOrNull(e.target.value);renderList()};$('bmax').oninput=e=>{bmax=numOrNull(e.target.value);renderList()};
function tri(btn,v){const b=btn.querySelector('.box');b.className='box'+(v==1?' on':v==2?' off':'');b.textContent=v==1?'✓':v==2?'✕':''}
$('fMega').onclick=()=>{mega=(mega+1)%3;renderList()};$('fLeg').onclick=()=>{leg=(leg+1)%3;renderList()};
$('q').oninput=renderList;$('forms').onchange=e=>{hideForms=e.target.checked;renderList()};
$('fClear').onclick=()=>{t1=t2=-1;bmin=bmax=null;mega=leg=0;hideForms=false;$('t1').value=$('t2').value='-1';$('bmin').value=$('bmax').value='';$('forms').checked=false;renderList()};
function passes(e){
  const ty=e.t,a=ty[0],b=ty[ty.length-1];
  if(t1>=0&&t2>=0){if(!((a==t1&&b==t2)||(a==t2&&b==t1)))return false}
  else{const t=Math.max(t1,t2);if(t>=0&&!ty.includes(t))return false}
  const s=bst(e);if(bmin!=null&&s<bmin||bmax!=null&&s>bmax)return false;
  if(mega==1&&!e.mg||mega==2&&e.mg||leg==1&&!e.lg||leg==2&&e.lg||hideForms&&e.f>0)return false;
  return true}
function active(){return (t1>=0)+(t2>=0)+(bmin!=null||bmax!=null)+(mega>0)+(leg>0)+(hideForms?1:0)}
function visible(){const q=fold($('q').value.trim());return E.filter(e=>passes(e)&&(!q||fold(e.n).includes(q)||String(e.s)==q))}
function renderList(){
  tri($('fMega'),mega);tri($('fLeg'),leg);const n=active();$('fSum').textContent=n?F.filtersOn.replace('{0}',n):F.filters;$('fClear').disabled=!n;
  const list=$('list'),v=visible();list.innerHTML='';
  $('count').textContent=F.shown.replace('{0}',v.length);
  for(const e of v){const d=document.createElement('div');d.className='row'+(cur&&cur.k==e.k?' sel':'');
    d.innerHTML=`<div class="strip" style="background:${bg(e.t)}"></div>${e.i?`<img src="${e.i}" alt="">`:'<span></span>'}<span class="num">${num(e.s)}</span><span>${esc(e.n)}</span><span class="bst">${bst(e)}</span>`;
    d.onclick=()=>{show(e);if(innerWidth<=820)$('detail').scrollIntoView({behavior:'smooth'})};list.appendChild(d);}
}
// The app's LevelTimeline: one line across the card, a dot per level in proportion, labels alternating above and
// below, a label moved one row out when it would touch the last one on its side.
const ROW=17,DOT=4.5,SIDE=18,ROWS=2;
const ctx=document.createElement('canvas').getContext('2d');ctx.font='600 11px "Segoe UI",system-ui,sans-serif';
function timeline(levels,width){
  const d=[...new Set(levels)].sort((a,b)=>a-b);if(!d.length)return '';
  const first=d[0],last=d[d.length-1],span=Math.max(1,width-2*SIDE),h=2*ROWS*ROW+8,mid=h/2;
  const ends=[[-1e9,-1e9],[-1e9,-1e9]];const marks=[];
  d.forEach((lv,i)=>{const x=last==first?width/2:SIDE+(lv-first)*span/(last-first);const text=lv==0?T.evo:String(lv);const half=ctx.measureText(text).width/2+3;
    let side=i%2==0?0:1,bs=side,bt=0,best=1e9;
    outer:for(const s of [side,1-side])for(let r=0;r<ROWS;r++){const ov=ends[s][r]-(x-half);if(ov<=0){bs=s;bt=r;best=0;break outer}if(ov<best){best=ov;bs=s;bt=r}}
    ends[bs][bt]=x+half;marks.push({x,text,above:bs==0,tier:bt})});
  let svg=`<svg width="${width}" height="${h}" viewBox="0 0 ${width} ${h}"><line x1="${marks[0].x}" y1="${mid}" x2="${marks[marks.length-1].x}" y2="${mid}" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>`;
  for(const m of marks){const dist=DOT+3+m.tier*ROW;const y=m.above?mid-dist-2:mid+dist+10;
    if(m.tier>0)svg+=`<line x1="${m.x}" x2="${m.x}" y1="${m.above?mid-DOT:mid+DOT}" y2="${m.above?mid-dist:mid+dist}" stroke="var(--muted)"/>`;
    svg+=`<text x="${m.x}" y="${y}" text-anchor="middle" fill="var(--accentText)">${esc(m.text)}</text><circle cx="${m.x}" cy="${mid}" r="${DOT}" fill="var(--accentText)"/>`}
  return svg+'</svg>';
}
function root(k){let r=k,n=0;while(parent.has(r)&&n++<8)r=parent.get(r);return r}
function evoHtml(k){
  const r=root(k);if(!kids.has(r))return `<div class="hint">${esc(T.noEvolution)}</div>`;
  const node=(key,how)=>{const e=byKey.get(key);if(!e)return '';return `<div class="mon${key==k?' cur':''}" style="background:${bg(e.t)};color:${fg(e.t)}" data-k="${key}">${e.i?`<img src="${e.i}" alt="">`:''}<b>${esc(e.n)}</b>${how?`<span class="how">${esc(how)}</span>`:''}</div>`};
  let html='',stage=[[r,'']],depth=0;
  while(stage.length&&depth++<8){html+=(html?'<span class="arrow">➔</span>':'')+`<div class="stage">${stage.map(([key,how])=>node(key,how)).join('')}</div>`;stage=stage.flatMap(([key])=>kids.get(key)||[])}
  return `<div class="evo">${html}</div>`;
}
function show(e){
  cur=e;const tot=bst(e);
  const stats=e.st.map((v,i)=>`<div class="info-row stat"><span class="hint">${esc(T.statNames[i])}</span><b>${v}</b><div class="track"><i style="width:${Math.max(1,Math.min(v,200)/2)}%;background:${statColor(v)}"></i></div></div>`).join('');
  $('detail').innerHTML=`
  <div class="header" style="background:${bg(e.t)};color:${fg(e.t)}">
    <div class="pic">${e.i?`<img src="${e.i}" alt="">`:''}</div>
    <div><div>${num(e.s)}</div><div class="name">${esc(e.n)}</div><div class="chips">${e.t.map(chip).join('')}</div></div>
    <div class="total"><small>${esc(T.total||'Total')}</small><b>${tot}</b></div>
  </div>
  <div class="card"><div class="card-title">${esc(T.stats)}</div>${stats}</div>
  <div class="card"><div class="card-title">${esc(T.evolution)}</div>${evoHtml(e.k)}</div>
  <div class="card" id="tlCard"><div class="card-title">${esc(T.moves)}</div><div id="tl"></div></div>`;
  drawTimeline();
  for(const m of document.querySelectorAll('.mon:not(.cur)'))m.onclick=()=>{const t=byKey.get(m.dataset.k);if(t){if(t.f&&hideForms){hideForms=false;$('forms').checked=false}show(t)}};
  renderList();
  const sel=document.querySelector('.row.sel');if(sel)sel.scrollIntoView({block:'nearest'});
}
function drawTimeline(){const box=$('tl');if(!box||!cur)return;box.innerHTML=timeline(cur.l,Math.max(200,box.clientWidth))}
window.addEventListener('resize',drawTimeline);
// Served by the app to the phone: reload when the page changes (the game saved), keeping the Pokémon on screen.
const KEEP='pokemanager-dex-current';
let start=visible()[0];
try{const k=sessionStorage.getItem(KEEP);if(k&&byKey.has(k))start=byKey.get(k)}catch(_){}
renderList();if(start)show(start);
if(D0&&location.protocol.startsWith('http')){let stamp=null;setInterval(async()=>{try{const r=await fetch('stamp',{cache:'no-store'});const t=await r.text();
  if(stamp&&t!==stamp){try{sessionStorage.setItem(KEEP,cur?cur.k:'')}catch(_){}location.reload()}stamp=t}catch(_){}},8000)}
}
function $(id){return document.getElementById(id)}
function unpack(j){if(j&&j.pokemanager==='pokedex'&&j.data)return j.data;if(j&&j.entries&&j.types)return j;throw new Error('format')}
function loader(){
  const es=(navigator.language||'').toLowerCase().startsWith('es');
  const L=es?{t:'Pokédex de Pokemanager',h:'Abre el archivo de Pokédex (.pkdex) que exporta Pokemanager desde la pestaña Pokédex. No sale del navegador.',p:'Elegir archivo…',e:'No es un archivo de Pokédex de Pokemanager.',f:'No se ha podido descargar el archivo.'}
    :{t:'Pokemanager Pokédex',h:'Open the Pokédex file (.pkdex) Pokemanager exports from the Pokédex tab. It never leaves the browser.',p:'Choose file…',e:'This is not a Pokemanager Pokédex file.',f:'The file could not be downloaded.'};
  $('app').hidden=true;$('loader').hidden=false;
  $('ldTitle').textContent=L.t;$('ldHint').textContent=L.h;$('ldPick').textContent=L.p;
  const open=text=>{try{const d=unpack(JSON.parse(text));try{localStorage.setItem('pokemanager-dex-file',text)}catch(_){}start(d)}catch(_){$('ldError').textContent=L.e}};
  $('ldFile').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(open)};
  document.addEventListener('dragover',e=>e.preventDefault());
  document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)f.text().then(open)});
  const src=new URLSearchParams(location.search).get('src');
  if(src){fetch(src).then(r=>{if(!r.ok)throw 0;return r.text()}).then(open).catch(()=>$('ldError').textContent=L.f);return}
