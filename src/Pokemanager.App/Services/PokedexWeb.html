<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#1e2128;--panel:#272b33;--panel2:#30353f;--line:#3b414c;--text:#eceef2;--muted:#9aa2ad;--accent:#f39c3c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:600}
input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:6px 10px;min-width:220px;flex:1;max-width:340px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--panel);color:var(--muted);border:0;padding:6px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--accent);color:#1a1a1a;font-weight:600}
label.tg{display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer}
.made{margin-left:auto;color:var(--muted);font-size:12px}
main{display:grid;grid-template-columns:320px 1fr;height:calc(100% - 55px)}
#list{overflow-y:auto;border-right:1px solid var(--line);padding:6px}
.row{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:4px;cursor:pointer;border-left:4px solid transparent}
.row:hover{background:var(--panel)}
.row.sel{background:var(--panel2)}
.row img{width:40px;height:30px;image-rendering:pixelated}
.row .num{color:var(--muted);font-size:12px;width:38px}
.row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--muted)}
.dot.sn{background:#5b8fd6;border-color:#5b8fd6}.dot.ca{background:#e05050;border-color:#e05050}
#detail{overflow-y:auto;padding:14px 18px}
.head{display:flex;gap:16px;align-items:center;padding:14px;border-radius:4px}
.head .pic{width:120px;height:90px;background:#ffffff50;border-radius:3px;display:flex;align-items:center;justify-content:center}
.head .pic img{width:120px;height:90px;image-rendering:pixelated}
.head h2{margin:0;font-size:24px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:1px 8px;border-radius:3px;font-size:12px;font-weight:600;border:1px solid #0003}
.badge{margin-left:auto;background:#fff;color:#1a1a1a;border-radius:3px;padding:4px 10px;text-align:center}
.badge small{display:block;font-size:10px;color:#666}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--accent);font-weight:600}
.stat{display:grid;grid-template-columns:80px 36px 1fr;gap:8px;align-items:center;padding:2px 0}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.info{display:grid;grid-template-columns:130px 1fr;gap:4px 10px}
.info span:nth-child(odd){color:var(--muted)}
.hidden{color:var(--muted);font-style:italic}
button.link{background:none;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:3px 10px;cursor:pointer;font:inherit}
.mu{display:flex;gap:8px;align-items:flex-start;margin:3px 0}.mu b{width:42px;flex:none}
.evo{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.evo .stage{display:flex;flex-direction:column;gap:6px}
.evo .mon{display:flex;flex-direction:column;align-items:center;padding:6px 8px;border-radius:4px;cursor:pointer;min-width:110px;border:2px solid transparent}
.evo .mon.cur{border-color:#fff}
.evo .mon img{width:60px;height:45px;image-rendering:pixelated}
.evo .how{font-size:11px;opacity:.85;text-align:center;max-width:140px}
.arrow{color:var(--muted);font-size:18px}
table{width:100%;border-collapse:collapse}td,th{padding:3px 6px;text-align:left}th{color:var(--muted);font-weight:400;font-size:12px}
tr+tr td{border-top:1px solid var(--line)}
.levels{display:flex;flex-wrap:wrap;gap:6px}.lv{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-weight:600}
.entry{font-style:italic;color:#d8dbe0;margin:10px 2px 0}
@media (max-width:760px){main{grid-template-columns:1fr;height:auto}#list{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <input type="search" id="q">
  <div class="seg" id="seg"></div>
  <label class="tg"><input type="checkbox" id="forms"> <span id="formsL"></span></label>
  <span class="made" id="made"></span>
</header>
<main><div id="list"></div><div id="detail"></div></main>
<script>
const D=/*DATA*/null;
const T=D.text,TY=D.types,E=D.entries;
const byKey=new Map(E.map(e=>[e.k,e]));
const kids=new Map(),parent=new Map();
for(const [a,b,h] of D.edges){if(!byKey.has(a)||!byKey.has(b))continue;if(!kids.has(a))kids.set(a,[]);if(!kids.get(a).some(x=>x[0]==b))kids.get(a).push([b,h]);if(!parent.has(b))parent.set(b,a);}
let filter='all',showForms=false,showAb=false,cur=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function soft(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,f=c=>Math.round(c+(255-c)*.18);return `rgb(${f(r)},${f(g)},${f(b)})`}
function fg(types){const l=types.reduce((s,t)=>{const n=parseInt(TY[t].c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,f=c=>c+(255-c)*.18;return s+(0.299*f(r)+0.587*f(g)+0.114*f(b))/255},0)/types.length;return l<.62?'#fff':'#1a1a1a'}
function bg(types){const a=soft(TY[types[0]].c),b=soft(TY[types[types.length-1]].c);return a==b?a:`linear-gradient(135deg,${a} 50%,${b} 50%)`}
function chip(t){return `<span class="chip" style="background:${soft(TY[t].c)};color:${fg([t])}">${esc(TY[t].n)}</span>`}
function barColor(v){return v<30?'#F34444':v<60?'#FF7F0F':v<90?'#FFDD57':v<120?'#A0E515':v<150?'#23CD5E':'#00C2B8'}
$('title').textContent=T.title;$('q').placeholder=T.search;$('formsL').textContent=T.forms;$('made').textContent=T.made;
const seg=$('seg');[['all',T.all],['seen',T.seen],['caught',T.caught]].forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{filter=k;render()};b.dataset.k=k;seg.appendChild(b)});
$('q').oninput=render;$('forms').onchange=e=>{showForms=e.target.checked;render()};
function visible(){const q=fold($('q').value.trim());return E.filter(e=>(showForms||e.f==0)&&(filter=='all'||(filter=='seen'?e.sn:e.ca))&&(!q||fold(e.n).includes(q)||String(e.s)==q||e.t.some(t=>fold(TY[t].n)==q)))}
function render(){
  for(const b of seg.children)b.classList.toggle('on',b.dataset.k==filter);
  const list=$('list');list.innerHTML='';
  for(const e of visible()){const d=document.createElement('div');d.className='row'+(cur&&cur.k==e.k?' sel':'');d.style.borderLeftColor=TY[e.t[0]].c;
    d.innerHTML=`<span class="num">#${String(e.s).padStart(3,'0')}</span>${e.i?`<img src="${e.i}" alt="">`:'<span style="width:40px"></span>'}<span class="nm">${esc(e.n)}</span>${e.d?`<span class="dot ${e.ca?'ca':e.sn?'sn':''}"></span>`:''}`;
    d.onclick=()=>show(e);list.appendChild(d);}
}
function root(k){let r=k,n=0;while(parent.has(r)&&n++<8)r=parent.get(r);return r}
function evoHtml(k){
  const r=root(k);if(!kids.has(r))return `<span class="hidden">${esc(T.noEvolution)}</span>`;
  function node(key,how){const e=byKey.get(key);if(!e)return '';return `<div class="mon${key==k?' cur':''}" style="background:${bg(e.t)};color:${fg(e.t)}" data-k="${key}">${e.i?`<img src="${e.i}" alt="">`:''}<b>${esc(e.n)}</b>${how?`<span class="how">${esc(how)}</span>`:''}</div>`}
  let html='',stage=[[r,'']],depth=0;
  while(stage.length&&depth++<8){html+=(html?'<span class="arrow">→</span>':'')+`<div class="stage">${stage.map(([key,how])=>node(key,how)).join('')}</div>`;
    stage=stage.flatMap(([key])=>kids.get(key)||[]);}
  return `<div class="evo">${html}</div>`;
}
function show(e){
  cur=e;const tot=e.st.reduce((a,b)=>a+b,0);
  const stats=e.st.map((v,i)=>`<div class="stat"><span>${esc(T.statNames[i])}</span><b>${v}</b><div class="bar"><i style="width:${Math.min(v,200)/2}%;background:${barColor(v)}"></i></div></div>`).join('');
  const mu=e.mu.filter(g=>g[0]!=1).map(g=>`<div class="mu"><b>×${g[0]}</b><div class="chips">${g[1].map(chip).join('')}</div></div>`).join('');
  const ab=showAb?e.ab.map((a,i)=>`<span>${esc(T.abilityNames[i])}</span><span>${esc(a)}</span>`).join(''):'';
  const learn=e.l.length?`<div class="levels">${e.l.map(lv=>`<span class="lv">${lv==0?esc(T.evo):lv}</span>`).join('')}</div>`:'—';
  $('detail').innerHTML=`
  <div class="head" style="background:${bg(e.t)};color:${fg(e.t)}"><div class="pic">${e.i?`<img src="${e.i}" alt="">`:''}</div>
   <div><div>#${String(e.s).padStart(3,'0')} ${esc(e.cl)}</div><h2>${esc(e.n)}</h2><div class="chips">${e.t.map(chip).join('')}</div></div>
   <div class="badge"><small>${esc(T.total)}</small><b>${tot}</b></div></div>
  ${e.en?`<p class="entry">${esc(e.en)}</p>`:''}
  <div class="grid">
   <div class="card"><h3>${esc(T.stats)}</h3>${stats}</div>
   <div class="card"><h3>${esc(T.matchups)}</h3>${mu}</div>
   <div class="card"><h3>${esc(T.abilities)}</h3>${showAb?`<div class="info">${ab}</div>`:''}<button class="link" id="tab">${esc(T.showAbilities)}</button></div>
   <div class="card"><h3>${esc(T.data)}</h3><div class="info"><span>${esc(T.height)}</span><span>${e.h} m</span><span>${esc(T.weight)}</span><span>${e.w} kg</span><span>${esc(T.catchRate)}</span><span>${e.cr}</span><span>${esc(T.eggGroups)}</span><span>${esc(e.eg)}</span><span>${esc(T.gender)}</span><span>${esc(e.ge)}</span><span>${esc(T.growth)}</span><span>${esc(e.gr)}</span><span>${esc(T.hatch)}</span><span>${e.hc}</span></div></div>
  </div>
  <div class="card" style="margin-top:10px"><h3>${esc(T.evolution)}</h3>${evoHtml(e.k)}</div>
  <div class="card" style="margin-top:10px"><h3>${esc(T.moves)}</h3>${learn}</div>`;
  $('tab').onclick=()=>{showAb=!showAb;show(cur)};
  for(const m of document.querySelectorAll('.evo .mon'))m.onclick=()=>{const t=byKey.get(m.dataset.k);if(t){if(t.f&&!showForms){showForms=true;$('forms').checked=true}show(t)}};
  render();
}
render();const first=visible()[0];if(first)show(first);
</script>
</body>
</html>
