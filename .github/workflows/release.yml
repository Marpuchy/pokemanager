name: Release

# Push a tag like v1.0.0 on main to build the Windows installer and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the v)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # JDK only for building: javac for the UPR launcher and jlink for the bundled runtime.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution Pokemanager.slnx -c Release

      - name: Build installer
        shell: pwsh
        run: ./build/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -JdkHome $env:JAVA_HOME

      - uses: actions/upload-artifact@v4
        with:
          name: Pokemanager-${{ steps.version.outputs.value }}-installer
          path: artifacts/installer/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Pokemanager ${{ steps.version.outputs.value }}
          body_path: docs/release-notes.md
          files: |
            artifacts/installer/PokemanagerApp-win-Setup.exe
            artifacts/installer/PokemanagerApp-win-Portable.zip
